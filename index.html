<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成語小達人 - 218題完整收錄互動測驗 APP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
    body {
      font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #FFF9E6 0%, #E8F5E9 100%);
      user-select: none;
    }
    .idiom-card {
      transition: all 0.15s ease;
    }
    .idiom-card:hover {
      transform: translateY(-2px);
    }
    .idiom-card.selected {
      background-color: #4ADE80 !important;
      color: white !important;
      border-color: #22C55E !important;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
    .drop-zone {
      min-width: 180px;
      min-height: 52px;
      border: 3px dashed #F59E0B;
      background-color: #FEF3C7;
      transition: all 0.2s ease;
    }
    .drop-zone.hover {
      background-color: #FDE68A;
      border-color: #D97706;
      transform: scale(1.05);
    }
    .drop-zone.filled {
      border-style: solid;
      border-color: #10B981;
      background-color: #D1FAE5;
    }
    .drag-item {
      cursor: grab;
      touch-action: none;
      transition: all 0.15s ease;
    }
    .drag-item:active {
      cursor: grabbing;
      transform: scale(1.08);
    }
    .drag-item.selected-tap {
      ring: 4px solid #3B82F6;
      transform: scale(1.08);
    }
    .pulse-animation {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>

<body class="min-h-screen text-slate-800 flex flex-col justify-between">

      </div>

      </div>
    </div>
  </header>

  <!-- 主內容區 -->

            </button>
          </div>

          <div class="relative flex-grow max-w-xs">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" oninput="filterIdioms()" placeholder="搜尋成語或編號 (如 206 或 寸草)..." class="w-full pl-9 pr-4 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">

    let selectedIdiomIds = new Set();
    let quizQuestions = [];
    let currentQuestionIdx = 0;
    let userAnswers = [];
    let currentScore = 0;
    let streakCount = 0;
    let selectedTapOption = null;
    let soundEnabled = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.exponentialRampToValueAtTime(784, now + 0.15);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'win') {
          [523, 659, 784, 1046].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + i * 0.1);
            g.gain.setValueAtTime(0.2, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.25);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.25);
          });
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundText').innerText = soundEnabled ? '音效開' : '靜音中';
      document.getElementById('soundIcon').className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderIdiomGrid(idiomsData);
      selectRandom(10);
    });

    function renderIdiomGrid(data) {
      const grid = document.getElementById('idiomsGrid');
      grid.innerHTML = '';
      data.forEach(item => {
        const isSelected = selectedIdiomIds.has(item.id);
        const card = document.createElement('div');
        card.className = `idiom-card p-2.5 bg-white rounded-2xl border-2 border-slate-200 flex items-center justify-between cursor-pointer select-none ${isSelected ? 'selected' : ''}`;
        card.id = `idiom-card-${item.id}`;
        card.onclick = () => toggleIdiomSelection(item.id);

        card.innerHTML = `
          <div class="flex items-center gap-1.5 overflow-hidden">
            <span class="text-xs px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-900 font-bold shrink-0">No.${item.id}</span>
            <span class="font-bold text-xs sm:text-sm truncate">${item.name}</span>
          </div>
          <div class="checkbox-icon text-base">
            <i class="${isSelected ? 'fas fa-check-circle' : 'far fa-circle text-slate-300'}"></i>
          </div>
        `;
        grid.appendChild(card);
      });
      updateSelectionSummary();
    }

    function toggleIdiomSelection(id) {
      playSound('click');
      if (selectedIdiomIds.has(id)) {
        selectedIdiomIds.delete(id);
      } else {
        selectedIdiomIds.add(id);
      }
      const card = document.getElementById(`idiom-card-${id}`);
      if (card) {
        const isSelected = selectedIdiomIds.has(id);
        card.classList.toggle('selected', isSelected);
        const icon = card.querySelector('.checkbox-icon i');
        icon.className = isSelected ? 'fas fa-check-circle' : 'far fa-circle text-slate-300';
      }
      updateSelectionSummary();
    }

    function updateSelectionSummary() {
      const count = selectedIdiomIds.size;
      document.getElementById('selectedCount').innerText = count;
      document.getElementById('startQuizBtn').disabled = count === 0;
    }

    function selectAllIdioms(select) {
      playSound('click');
      selectedIdiomIds.clear();
      if (select) {
        idiomsData.forEach(item => selectedIdiomIds.add(item.id));
      }
      renderIdiomGrid(idiomsData);
    }

    function selectRandom(n) {
      playSound('click');
      selectedIdiomIds.clear();
      const shuffled = [...idiomsData].sort(() => 0.5 - Math.random());
      shuffled.slice(0, Math.min(n, idiomsData.length)).forEach(item => selectedIdiomIds.add(item.id));
      renderIdiomGrid(idiomsData);
    }

    function filterIdioms() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = idiomsData.filter(item => 
        item.name.includes(query) || item.id.toString() === query
      );
      renderIdiomGrid(filtered);
    }

    function startQuiz() {
      playSound('click');
      if (selectedIdiomIds.size === 0) return;

      const selectedIdioms = idiomsData.filter(item => selectedIdiomIds.has(item.id));
      quizQuestions = selectedIdioms.map(item => {
        const randomSentence = item.ex[Math.floor(Math.random() * item.ex.length)];
        return {
          idiomId: item.id,
          idiomName: item.name,
          sentence: randomSentence,
          definition: item.def
        };
      });

      quizQuestions.sort(() => 0.5 - Math.random());
      currentQuestionIdx = 0;
      currentScore = 0;
      streakCount = 0;
      userAnswers = [];

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('resultScreen').classList.add('hidden');

      loadQuestion(currentQuestionIdx);
    }

    function loadQuestion(idx) {
      selectedTapOption = null;
      const q = quizQuestions[idx];

      document.getElementById('progressText').innerText = `第 ${idx + 1} / ${quizQuestions.length} 題`;
      document.getElementById('scoreText').innerText = `目前得分: ${currentScore}`;
      document.getElementById('quizStreak').innerText = `連續答對 ${streakCount} 題`;
      document.getElementById('progressBar').style.width = `${((idx + 1) / quizQuestions.length) * 100}%`;
      document.getElementById('currentIdiomNo').innerText = q.idiomId;

      document.getElementById('feedbackBox').className = 'hidden p-3 rounded-2xl text-center font-black text-base transition-all';
      document.getElementById('submitBtn').classList.remove('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      const container = document.getElementById('sentenceContainer');
      container.innerHTML = '';

      const parts = q.sentence.split('______');
      container.appendChild(document.createTextNode(parts[0]));

      const dropZone = document.createElement('div');
      dropZone.className = 'drop-zone rounded-2xl flex items-center justify-center font-black text-xl text-amber-900 shadow-inner px-4 py-2 my-1';
      dropZone.id = 'dropZone';
      dropZone.innerText = '點擊成語或拖曳至此';
      
      dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
      dropZone.ondragleave = () => dropZone.classList.remove('hover');
      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        const text = e.dataTransfer.getData('text/plain');
        if (text) fillDropZone(text);
      };
      dropZone.onclick = () => {
        if (selectedTapOption) fillDropZone(selectedTapOption);
      };

      container.appendChild(dropZone);
      container.appendChild(document.createTextNode(parts[1]));

      // 優先從本次勾選的成語池中挑選干擾選項
      let selectedDistractorPool = idiomsData
        .filter(item => selectedIdiomIds.has(item.id) && item.name !== q.idiomName)
        .sort(() => 0.5 - Math.random());

      let chosenDistractors = selectedDistractorPool.slice(0, 3).map(item => item.name);

      // 若勾選數量不足 3 個干擾項，再由未勾選的其他成語補足
      if (chosenDistractors.length < 3) {
        let needed = 3 - chosenDistractors.length;
        let remainingPool = idiomsData
          .filter(item => !selectedIdiomIds.has(item.id) && item.name !== q.idiomName)
          .sort(() => 0.5 - Math.random());
        
        let extraDistractors = remainingPool.slice(0, needed).map(item => item.name);
        chosenDistractors = chosenDistractors.concat(extraDistractors);
      }

      let options = [q.idiomName, ...chosenDistractors].sort(() => 0.5 - Math.random());

      const optionsPool = document.getElementById('optionsPool');
      optionsPool.innerHTML = '';
      options.forEach(optText => {
        const optCard = document.createElement('div');
        optCard.className = 'drag-item px-5 py-2.5 bg-white border-2 border-amber-300 hover:border-amber-400 text-amber-900 font-black rounded-2xl shadow-sm text-lg select-none';
        optCard.innerText = optText;
        optCard.draggable = true;

        optCard.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', optText);
          playSound('click');
        };

        optCard.onclick = () => {
          playSound('click');
          document.querySelectorAll('.drag-item').forEach(el => el.classList.remove('selected-tap'));
          selectedTapOption = optText;
          optCard.classList.add('selected-tap');
          fillDropZone(optText);
        };

        optionsPool.appendChild(optCard);
      });
    }

    function fillDropZone(text) {
      playSound('click');
      const dropZone = document.getElementById('dropZone');
      dropZone.innerText = text;
      dropZone.classList.add('filled');
      dropZone.setAttribute('data-answer', text);
    }

    function checkAnswer() {
      const dropZone = document.getElementById('dropZone');
      const userAns = dropZone.getAttribute('data-answer');
      const q = quizQuestions[currentQuestionIdx];

      if (!userAns) {
        alert('請先選擇或拖曳成語填入空格中喔！');
        return;
      }

      const isCorrect = userAns === q.idiomName;
      userAnswers.push({
        question: q,
        userAnswer: userAns,
        isCorrect: isCorrect
      });

      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.classList.remove('hidden');

      if (isCorrect) {
        playSound('correct');
        currentScore += Math.round(100 / quizQuestions.length);
        streakCount++;
        feedbackBox.className = 'p-4 rounded-2xl bg-emerald-100 border-2 border-emerald-400 text-emerald-900 font-black text-center text-lg';
        feedbackBox.innerHTML = `🎉 答對了！太棒了！<br><span class="text-sm font-bold text-emerald-800">【${q.idiomName}】${q.definition}</span>`;
      } else {
        playSound('wrong');
        streakCount = 0;
        feedbackBox.className = 'p-4 rounded-2xl bg-rose-100 border-2 border-rose-400 text-rose-900 font-black text-center text-lg';
        feedbackBox.innerHTML = `❌ 正確答案是：<span class="text-emerald-700 underline">${q.idiomName}</span><br><span class="text-sm font-bold text-rose-800">【釋義】${q.definition}</span>`;
      }

      document.getElementById('submitBtn').classList.add('hidden');
      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function nextQuestion() {
      playSound('click');
      currentQuestionIdx++;
      if (currentQuestionIdx < quizQuestions.length) {
        loadQuestion(currentQuestionIdx);
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      const totalQ = quizQuestions.length;
      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      const score = Math.round((correctCount / totalQ) * 100);

      document.getElementById('finalScore').innerText = score;
      document.getElementById('finalCorrectRatio').innerText = `${correctCount} / ${totalQ}`;

      let rankTitle = '成語大師！';
      let badge = '🏆';
      let stars = 5;

      if (score === 100) {
        rankTitle = '👑 成語神仙大師！全對！';
        badge = '🥇';
        stars = 5;
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        playSound('win');
      } else if (score >= 80) {
        rankTitle = '🌟 成語小霸王！非常優秀！';
        badge = '🥈';
        stars = 4;
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        playSound('win');
      } else if (score >= 60) {
        rankTitle = '👍 成語小達人！表現不錯！';
        badge = '🥉';
        stars = 3;
      } else {
        rankTitle = '💪 繼續努力！再試一次！';
        badge = '📖';
        stars = 2;
      }

      document.getElementById('resultRank').innerText = rankTitle;
      document.getElementById('badgeIcon').innerText = badge;

      let starHtml = '';
      for (let i = 0; i < 5; i++) {
        starHtml += `<i class="${i < stars ? 'fas' : 'far'} fa-star"></i>`;
      }
      document.getElementById('starRating').innerHTML = starHtml;

      const reviewContainer = document.getElementById('reviewContainer');
      reviewContainer.innerHTML = '';

      userAnswers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `p-4 rounded-2xl border-2 ${ans.isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'} space-y-2`;

        const sentenceDisplay = ans.question.sentence.replace('______', `【 ${ans.userAnswer} 】`);

        item.innerHTML = `
          <div class="flex items-center justify-between font-black text-sm">
            <span>第 ${i + 1} 題：No.${ans.question.idiomId} ${ans.question.idiomName}</span>
            <span class="${ans.isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
              ${ans.isCorrect ? '✅ 答對' : '❌ 答錯'}
            </span>
          </div>
          <div class="text-base font-bold text-slate-700">
            原句：${sentenceDisplay}
          </div>
          ${!ans.isCorrect ? `<div class="text-sm font-bold text-emerald-700">👉 正確成語：【${ans.question.idiomName}】</div>` : ''}
          <div class="text-xs text-slate-500 font-bold bg-white p-2.5 rounded-xl border border-slate-100">
            💡 <strong>成語釋義：</strong>${ans.question.definition}
          </div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    function goHome() {
      playSound('click');
      document.getElementById('startScreen').classList.remove('hidden');
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
    }

    function restartQuiz() {
      startQuiz();
    }

    function confirmExit() {
      if (confirm('確定要離開本次測驗嗎？')) {
        goHome();
      }
    }
  </script>
</body>
</html>
